# cargo-deny configuration. Run: cargo deny check licenses

[graph]
all-features = true

[licenses]
version = 2
# Licences compatible with distributing the game under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The direct-dependency allowlist (CLAUDE.md) is enforced by review and the content
# validator step; cargo-deny's ban lists also cover transitive crates, which are not policed.
